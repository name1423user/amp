[project]
name = "amp-protocol"
version = "0.3.0"
description = "AI-to-AI message protocol: JSON structured messages to English audit-log sentences."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "lemminflect",
    "inflect",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/name1423user/amp"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
amp = "amp.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amp*"]
